apiVersion: v1
kind: ConfigMap
metadata:
  name: mylinkedin-config
  namespace: mylinkedin
data:
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discovery-server:8761/eureka/"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_NEO4J_URI: "bolt://neo4j:7687"
  SPRING_DATASOURCE_URL_USER: "jdbc:postgresql://postgres:5432/userDb"
  SPRING_DATASOURCE_URL_POST: "jdbc:postgresql://postgres:5432/postDb"
  SPRING_DATASOURCE_URL_NOTIFICATION: "jdbc:postgresql://postgres:5432/notification_db"
  SPRING_DATASOURCE_USERNAME: "postgres"
  ZIPKIN_URL: "http://zipkin:9411/api/v2/spans"
