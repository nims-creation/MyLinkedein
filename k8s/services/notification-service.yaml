# ============================================================
# Notification Service — Deployment + Service
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: mylinkedin
spec:
  selector:
    app: notification-service
  ports:
    - port: 9040
      targetPort: 9040
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: mylinkedin
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: mylinkedin/notification-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9040
          envFrom:
            - configMapRef:
                name: mylinkedin-config
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/notification_db"
            - name: SPRING_DATASOURCE_USERNAME
              value: postgres
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mylinkedin-secrets
                  key: DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 9040
            initialDelaySeconds: 40
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
