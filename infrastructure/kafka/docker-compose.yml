  services:
    kafka:
      image: apache/kafka:4.1.2
      container_name: mylinkedin-kafka
      hostname: kafka
      ports:
        - "9092:9092"

      environment:
        # KRaft configuration
        KAFKA_NODE_ID: 1
        KAFKA_PROCESS_ROLES: broker,controller

        # Three listeners
        KAFKA_LISTENERS: CONTROLLER://localhost:9093,HOST://0.0.0.0:9092,DOCKER://0.0.0.0:29092

        # Addresses advertised to clients
        KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092

        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,DOCKER:PLAINTEXT

        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

        # Internal broker communication
        KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER

        # Single-node development settings
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        KAFKA_NUM_PARTITIONS: 3

        # Kafka storage
        KAFKA_LOG_DIRS: /var/lib/kafka/data

      volumes:
        - kafka_data:/var/lib/kafka/data

      restart: unless-stopped

    # Neo4j Database
    neo4j:
      image: neo4j:5
      container_name: mylinkedin-neo4j
      hostname: neo4j

      ports:
        - "7474:7474"
        - "7687:7687"

      environment:
        NEO4J_AUTH: neo4j/YourStrongPassword123

      volumes:
        - neo4j_data:/data

      restart: unless-stopped

  volumes:
    kafka_data:
    neo4j_data:
