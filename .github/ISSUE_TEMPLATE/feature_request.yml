name: "Feature request"
description: "Suggest a new feature or a meaningful improvement to MyLinkedin."
title: "[Feature]: "
labels:
  - "enhancement"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape MyLinkedin! Please review the [roadmap](https://github.com/nims-creation/MyLinkedein#-future-roadmap), search existing issues, and describe the user problem before the solution.
        For significant architecture changes, discuss the approach with the maintainer before opening a large pull request.
  - type: dropdown
    id: area
    attributes:
      label: "Area of the project"
      options:
        - "Backend / REST APIs"
        - "Kafka / Event-driven systems"
        - "Search / Feed / Recommendations"
        - "Graph / Connections"
        - "Frontend / UX"
        - "Authentication / Security"
        - "Performance / Reliability"
        - "Testing / CI/CD"
        - "DevOps / Kubernetes"
        - "Documentation"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: "What problem does this solve?"
      description: "Describe who needs this and what is difficult today."
      placeholder: "As a user or contributor, I want to ..., because ..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "Proposed feature or change"
      description: "Describe expected behavior, user flow, and affected APIs/services if known."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "How would we know it works?"
      description: "List acceptance criteria or example scenarios; include edge cases where relevant."
      placeholder: |
        - [ ] A user can ...
        - [ ] Unauthorized requests are rejected ...
        - [ ] Relevant tests cover ...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives or technical trade-offs (optional)"
      description: "Other solutions considered, design concerns, performance impact, data migrations, or links."
  - type: dropdown
    id: contribution
    attributes:
      label: "Would you like to help implement it?"
      options:
        - "Yes, I can work on this after scope agreement"
        - "I can help with design, review, or testing"
        - "Not right now"
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: "Before submitting"
      options:
        - label: "I checked existing issues and the project roadmap for similar requests."
          required: true
