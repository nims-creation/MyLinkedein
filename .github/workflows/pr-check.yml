# ============================================================================
# PR Check — Lightweight build validation for pull requests
# ============================================================================

name: PR Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Build all backend services in parallel ──
  build-backend:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - post-service
          - ConnectionService
          - notification-service
          - uploader-service
          - api-gateway
          - discovery-server
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Build ${{ matrix.service }}
        run: |
          cd ${{ matrix.service }}
          chmod +x mvnw
          ./mvnw clean verify -DskipTests -B

  # ── Build React frontend ──
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: mylinkedin-frontend/package-lock.json

      - name: Install dependencies & build
        run: |
          cd mylinkedin-frontend
          npm ci
          npm run build
